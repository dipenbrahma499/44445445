<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact · dipen.vercel.app</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
        rel="stylesheet"
    />

    <style>

        /* =========================
           GLOBAL RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           ROOT
        ========================== */

        :root {
            --primary-theme: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
        }


        /* =========================
           BODY
        ========================== */

        body {
            background-color: #0e1117;
            color: #f8fafc;

            overflow-x: hidden;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                'Segoe UI', system-ui, sans-serif;

            padding: 1.5rem;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            position: relative;
        }


        /* =========================
           DARK SKEUOMORPHIC BACKGROUND
        ========================== */

        .modern-bg {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: -10;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #1a2230 0%,
                    #0e1117 65%,
                    #080a0f 100%
                );
        }


        /* =========================
           GRID PATTERN
        ========================== */

        .grid-pattern {
            position: absolute;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            background-image:
                linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                );

            background-size: 36px 36px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 60%,
                    transparent 90%
                );

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black 60%,
                    transparent 90%
                );
        }


        /* =========================
           AMBIENT BLUE GLOW
        ========================== */

        .ambient-glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(37, 99, 235, 0.08);

            filter: blur(120px);

            pointer-events: none;
        }

        .glow-left {
            top: 10%;
            left: -180px;
        }

        .glow-right {
            bottom: 5%;
            right: -180px;

            background: rgba(79, 70, 229, 0.07);
        }


        /* =========================
           CONTACT CARD
        ========================== */

        .card {
            max-width: 600px;
            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    rgba(29, 37, 50, 0.94),
                    rgba(18, 24, 33, 0.94)
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 40px;

            padding: 2.8rem 2.5rem;

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                12px 12px 30px rgba(0, 0, 0, 0.55),
                -10px -10px 30px rgba(35, 44, 59, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.10);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-3px);

            box-shadow:
                16px 16px 35px rgba(0, 0, 0, 0.65),
                -12px -12px 35px rgba(41, 52, 70, 0.40),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }


        /* =========================
           HEADING
        ========================== */

        h1 {
            font-size: 2.1rem;

            font-weight: 600;

            letter-spacing: -0.02em;

            color: #f8fafc;

            display: flex;

            align-items: center;

            gap: 0.5rem;

            margin-bottom: 0.4rem;
        }


        /* =========================
           SUBHEAD
        ========================== */

        .subhead {
            font-size: 0.95rem;

            color: #94a3b8;

            margin-bottom: 2rem;

            border-left: 4px solid #3b82f6;

            padding-left: 1rem;

            background: rgba(59, 130, 246, 0.05);

            border-radius: 0 12px 12px 0;

            padding-top: 0.35rem;
            padding-bottom: 0.35rem;
        }


        .subhead span {
            background: #172033;

            color: #e2e8f0;

            padding: 0.1rem 0.8rem;

            border-radius: 40px;

            font-size: 0.7rem;

            font-weight: 600;

            letter-spacing: 0.3px;

            margin-left: 0.5rem;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }


        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 1.6rem;
        }


        label {
            display: block;

            font-weight: 500;

            font-size: 0.9rem;

            color: #cbd5e1;

            margin-bottom: 0.4rem;

            letter-spacing: -0.01em;
        }


        /* =========================
           INPUTS
        ========================== */

        input,
        textarea {
            width: 100%;

            padding: 0.9rem 1.2rem;

            font-size: 1rem;

            background: #0d121a;

            border: 1.5px solid rgba(255, 255, 255, 0.10);

            border-radius: 24px;

            transition: all 0.2s ease;

            font-family: inherit;

            outline: none;

            color: #f8fafc;

            box-shadow:
                inset 4px 4px 10px rgba(0, 0, 0, 0.35),
                inset -4px -4px 10px rgba(30, 38, 52, 0.35);
        }


        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }


        input:focus,
        textarea:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 4px rgba(59, 130, 246, 0.12),
                inset 3px 3px 8px rgba(0, 0, 0, 0.35);

            background: #101722;
        }


        textarea {
            min-height: 130px;

            resize: vertical;
        }


        /* =========================
           SEND BUTTON
        ========================== */

        .btn {
            background:
                linear-gradient(
                    145deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            border: 1px solid rgba(255, 255, 255, 0.18);

            padding: 1rem 2.2rem;

            font-size: 1.05rem;

            font-weight: 600;

            border-radius: 60px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 0.6rem;

            cursor: pointer;

            transition: all 0.2s ease;

            box-shadow:
                7px 7px 16px rgba(0, 0, 0, 0.45),
                -5px -5px 14px rgba(59, 130, 246, 0.18),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);

            width: 100%;

            letter-spacing: 0.3px;
        }


        .btn:hover {
            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #1d4ed8
                );

            transform: translateY(-2px);

            box-shadow:
                9px 9px 20px rgba(0, 0, 0, 0.55),
                -6px -6px 16px rgba(59, 130, 246, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
        }


        .btn:active {
            transform: translateY(1px);

            box-shadow:
                inset 4px 4px 8px rgba(0, 0, 0, 0.5),
                inset -4px -4px 8px rgba(59, 130, 246, 0.3);
        }


        .btn:disabled {
            opacity: 0.6;

            pointer-events: none;

            filter: grayscale(0.3);
        }


        /* =========================
           STATUS MESSAGE
        ========================== */

        .status-msg {
            margin-top: 1.6rem;

            padding: 0.9rem 1.2rem;

            border-radius: 60px;

            font-weight: 500;

            font-size: 0.95rem;

            background: #172033;

            color: #cbd5e1;

            border: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;

            align-items: center;

            gap: 0.6rem;

            transition: all 0.2s;
        }


        .status-msg.success {
            background: rgba(16, 185, 129, 0.12);

            border-color: rgba(52, 211, 153, 0.35);

            color: #6ee7b7;
        }


        .status-msg.error {
            background: rgba(239, 68, 68, 0.12);

            border-color: rgba(248, 113, 113, 0.35);

            color: #fca5a5;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer-note {
            margin-top: 2rem;

            font-size: 0.75rem;

            color: #64748b;

            text-align: center;

            border-top: 1px solid rgba(255, 255, 255, 0.06);

            padding-top: 1.2rem;

            letter-spacing: 0.3px;
        }


        .footer-note strong {
            color: #cbd5e1;

            font-weight: 600;
        }


        /* =========================
           BADGE
        ========================== */

        .badge {
            background:
                linear-gradient(
                    145deg,
                    #1c2430,
                    #131922
                );

            padding: 0.2rem 1rem;

            border-radius: 60px;

            font-size: 0.7rem;

            font-weight: 600;

            color: #cbd5e1;

            display: inline-block;

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                2px 2px 5px rgba(0, 0, 0, 0.35),
                -2px -2px 5px rgba(33, 42, 56, 0.25);
        }


        /* =========================
           LOADER
        ========================== */

        .loader {
            display: inline-block;

            width: 20px;

            height: 20px;

            border: 3px solid rgba(255,255,255,0.3);

            border-radius: 50%;

            border-top-color: #fff;

            animation: spin 0.8s ease-in-out infinite;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding: 1rem;
            }

            .card {
                padding: 2rem 1.2rem;

                border-radius: 28px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .modern-bg {
                min-height: 100%;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         DARK BACKGROUND
    ========================== -->

    <div class="modern-bg">

        <div class="grid-pattern"></div>

        <div class="ambient-glow glow-left"></div>

        <div class="ambient-glow glow-right"></div>

    </div>


    <!-- =========================
         CONTACT CARD
    ========================== -->

    <div class="card">

        <h1>✉️ Contact</h1>

        <br>


        <form id="contactForm" novalidate>

            <div class="form-group">
                <label for="name"><b>Your Name</b> *</label>

                <input
                    type="text"
                    id="name"
                    placeholder="e.g. Dipen Patel"
                    required
                />
            </div>


            <div class="form-group">
                <label for="email"><b>Email</b> *</label>

                <input
                    type="email"
                    id="email"
                    placeholder="hello@example.com"
                    required
                />
            </div>


            <div class="form-group">
                <label for="Phone"><b>Phone Number</b> *</label>

                <input
                    type="tel"
                    id="Phone"
                    placeholder="+91 80999 *****"
                    required
                />
            </div>


            <div class="form-group">
                <label for="subject"><b>Subject</b></label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                />
            </div>


            <div class="form-group">
                <label for="message"><b>Message</b>  *</label>

                <textarea
                    id="message"
                    placeholder="Tell us what you're thinking..."
                    required
                ></textarea>
            </div>


            <button
                type="submit"
                class="btn"
                id="sendBtn"
            >
                <span>📨</span>
                Send message
            </button>

        </form>


        <div
            id="statusMessage"
            class="status-msg"
            style="display: none;"
        >
            <span id="statusIcon">✅</span>

            <span id="statusText">
                Ready
            </span>
        </div>


        <div class="footer-note">

            <strong>⚡ .env + SMTP</strong>
            · serverless via Vercel ·

            <span class="badge">
                deploy ready
            </span>

            <br />

            dipen.vercel.app

        </div>

    </div>


    <!-- =========================
         CONTACT FORM JS
    ========================== -->

    <script>
(function () {
    const form = document.getElementById('contactForm');
    const sendBtn = document.getElementById('sendBtn');

    const statusDiv = document.getElementById('statusMessage');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');

    function setStatus(type, message, icon = '✅') {
        statusDiv.style.display = 'flex';
        statusDiv.className = 'status-msg';

        if (type === 'success') {
            statusDiv.classList.add('success');
        }

        if (type === 'error') {
            statusDiv.classList.add('error');
        }

        statusIcon.textContent = icon;
        statusText.textContent = message;
    }

    function hideStatus() {
        statusDiv.style.display = 'none';
    }

    form.addEventListener('input', hideStatus);

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('Phone').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        // Required fields
        if (!name || !email || !phone || !message) {
            setStatus(
                'error',
                'Please fill in all required fields.',
                '⚠️'
            );
            return;
        }

        // Email validation
        const emailRegex =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
            setStatus(
                'error',
                'Please enter a valid email address.',
                '⚠️'
            );
            return;
        }

        // India phone validation
        const phoneClean = phone.replace(/\s+/g, '');

        const phoneRegex =
            /^(?:\+91|91)?[6-9]\d{9}$/;

        if (!phoneRegex.test(phoneClean)) {
            setStatus(
                'error',
                'Please enter a valid Indian phone number.',
                '⚠️'
            );
            return;
        }

        // Loading state
        sendBtn.disabled = true;

        sendBtn.innerHTML =
            `<span class="loader"></span> Sending...`;

        setStatus(
            '',
            'Sending your message...',
            '⏳'
        );

        try {
            const response = await fetch('/api/contact', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    name,
                    email,
                    phone,
                    subject,
                    message
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    `Server error (${response.status})`
                );
            }

            setStatus(
                'success',
                data.message ||
                'Message sent successfully!',
                '🎉'
            );

            form.reset();

        } catch (error) {

            console.error(
                'Contact form error:',
                error
            );

            setStatus(
                'error',
                error.message ||
                'Something went wrong. Please try again later.',
                '❌'
            );

        } finally {

            sendBtn.disabled = false;

            sendBtn.innerHTML =
                `<span>📨</span> Send message`;
        }
    });
})();
</script>

</body>
