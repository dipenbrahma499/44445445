<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f9f9f9;
    }
    h1 { text-align: center; color: #333; }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      width: 100%;
      background: #0070f3;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .success { color: green; margin-top: 15px; text-align: center; }
    .error { color: red; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <h1>Contact Us</h1>

  <form id="contactForm">
    <label>Name</label>
    <input type="text" id="name" required placeholder="Your name" />

    <label>Email</label>
    <input type="email" id="email" required placeholder="Your email" />

    <label>Phone</label>
    <input type="tel" id="phone" required placeholder="Your phone number" />

    <label>Subject (Optional)</label>
    <input type="text" id="subject" placeholder="Subject" />

    <label>Message</label>
    <textarea id="message" rows="5" required placeholder="Your message..."></textarea>

    <button type="submit" id="submitBtn">Send Message</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("contactForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      status.textContent = "";
      status.className = "";

      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, phone, subject, message }),
        });

        const data = await res.json();

        if (res.ok) {
          status.textContent = "Message sent successfully!";
          status.className = "success";
          form.reset();
        } else {
          status.textContent = data.error || "Failed to send message";
          status.className = "error";
        }
      } catch (err) {
        status.textContent = "Something went wrong. Please try again.";
        status.className = "error";
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Send Message";
    });
  </script>

</body>
</html>
